        .year-links a:hover {

            transform: translateX(-5px);
        }
        
        .form-section {
            margin-top: 40px;

        .form-section h2 {

            border: none;
            border-radius: 8px;

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 20px;
            }
