    להפסיק לדבר איתי מלבד בקללות, ואחר שגרם לכל האנשים בעבודה להסתכל עלי מאוד מוזר.
    לא הבנתי למה כי לא זכרתי אותם בעצמי, עד שקראתי את המדריך וקלטתי שקניתי "כרית זיכרון
    חכמה עם חיבור לאינטרנט".
  length: 265
- time: 11/1/2026 22:05:44
  author: 'נטע הבלין '
  keyword: כרית
  story: "בבית החדש היה חדר אחד פחות, ובכל זאת מספיק מקום. \nזה היה בלתי נסבל.\n\n\
    הם עברו בסוף הקיץ, כדי לנצל את סוף החופש עם הילדים, לארוז ולפרוק ביחד, לתת להם\
    \ להתמקם.\n\nלמרות שהחליטו פה אחד לעבור, וכולם היו שותפים בהחלטה, כשהגיע הזמן\
    \ אף אחד לא רצה לעזוב.\n\nארבעה ימים ישבה בחדר של הקטנה שכבר איננה והסתכלה על\
    \ הקירות. ניסתה להביא את עצמה להתחיל לארוז ולא הצליחה לזוז.\n\nבסוף ביקשה מהמובילים:\n\
    \"את החדר הזה תארזו אתם.\nכשנגיע תורידו הכל למחסן\".\n\nהאיש והילדים נסעו לבית\
    \ החדש, והיא ישבה בחצר הבניין והסתכלה על שיח הלואיזה שצמח פרא. ליטפה עלה עלה במבט.\n\
    \nהמובילים יצאו, העמיסו, נסעו.\n\nהיא כתבה לאיש שלה:\nתזמין להם שווארמה, עבדו\
    \ קשה.\nולא כתבה:\nאיך אנחנו הולכים מכאן בלעדיה.\nבעומק הרחם היא הרגישה את חבל\
    \ הטבור פועם.\n\nסיבוב אחרון לראות שהכל מסודר ופנוי - חצר, בית, חדרים, מחסן, מקלט.\n\
    \nחתולה מצונפת על הכרית הקטנה, שנשכחה שם אחרי האזעקה האחרונה. שועלים וינשופים,\
    \ והשם שלה באותיות בד צבעוניות.\n\"תשמרי עליה, חתולה. לך יש תשע נשמות, לי היתה\
    \ אחת\"."
  length: 917
- time: 11/2/2026 7:46:22
