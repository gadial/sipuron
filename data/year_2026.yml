    ג''יין עמדה שעה ארוכה מעבר למעקה הבטיחות. בשעת לילה כזו לא עברו כמעט מכוניות על
    הגשר, והיא התמקדה ברחש המים הזורמים. אור הירח השתקף במי הנהר, שזרמו בעצלתיים מתחתיה,
    והפכפוך נתן קצת שקט לנפשה.


    איך יכלה להיות כל כך טיפשה? היא ידעה שהנרי נשוי, שמבחינתו זה רק סטוץ, ובכל זאת
    נתנה לעצמה להתאהב בו. וכשבאה אליו עם תוצאות בדיקת ההריון, מה בדיוק חשבה לעצמה
    שהוא יגיד? הרי לא היה שום סיכוי שהוא יעזוב את אשתו. הוא היה גלוי ואמר לה את זה
    כבר בהתחלה, והיא האמינה לו, ועדיין הגיעה למצב הדפוק הזה.


    ג''יין ליטפה את בטנה. העובר שבתוכה בקושי בגודל של תות, ויש עוד חודשים ארוכים עד
    שהבטן תתחיל לתפוח, אבל היא חשבה שהרגישה שם משהו. להרוג אותו זה חטא, זה ברור, אבל
    אם היא כבר עומדת להרוג את עצמה אז מה זה משנה.


    "זה לא שווה את זה," אמר קול נשי חלש מעבר לכתפה. ג''יין נבהלה וכמעט מעדה ונפלה
    אל הנהר, אבל שלחה יד באינסטינקט ואחזה במעקה. היא הביטה אחורה וראתה אישה בערך בת
    גילה, לבושה בשמלה מיושנת ובלויה. עורה של האישה היה חיוור גם באור הירח המועט, ועיניה
    היו כבויות.


    "אני יודעת מה אני עושה," ג''יין ענתה, ומחתה דמעה בידה החופשית.


    "לא, את לא," אמרה האישה ונדה בראשה לשלילה באיטיות. "אין לך דרך לדעת, וגם אם אספר
    לך לא תאמיני לי."


    "תספרי לי מה?" ג''יין שאלה. "שאם אני רק אלך הביתה ואשן טוב בלילה אז בבוקר הכל
    ייראה יותר טוב?"


    האישה עשתה באיטיות מספר צעדים קטנים לעבר ג''יין, וג''יין הרגישה פתאום קיפאון שחדר
    לעצמותיה.


    "אני עמדתי במקום שבו את עומדת. הבוס שלי אנס אותי, ואף אחד לא האמין לי. כולם אמרו
    שאני בטח מדמיינת, ואם קרה משהו אז זה רק כי פיתיתי אותו. כשגיליתי שאני בהריון באתי
    לפה וקפצתי לתוך הנהר. היו לי עשרים שניות של אושר בזמן שנפלתי, כשחשבתי שאני משאירה
    את הכל מאחוריי, כשחשבתי שאני נפטרת מהכאב שהתעוררתי איתו כל בוקר והלכתי לישון איתו
    כל ערב. אבל טעיתי. הגוף הפסיק לכאוב, אבל הנשמה שלי עדיין כואבת, ובלי הגוף אין
    דרך לרפא את הנשמה. ומאז אני כאן על הגשר, והכאב נשאר איתי, כבר שמונים ושלוש שנים.
    אל תעשי את הטעות שאני עשיתי."


    האישה הסתובבה והלכה משם, ותוך שניות נבלעה בחשכה. ג''יין נשארה שם עוד שתי דקות,
    חככה בדעתה, אבל לבסוף טיפסה לצידו השני של המעקה והלכה לכיוון הרכב שהשאירה בצידו
    המזרחי של הגשר.'
