  author: יובל מישורי
  keyword: גשם
  story: 'אני מסתובב בעיר המטונפת הזאת כבר כל כך הרבה שנים, רואה כל סיגריה שזרוקה
    על המדרכה, כל מסטיק דבוק, כל עיתון שהרוח מגלגלת במורד הרחובות, ואנשים עוברים ולא
    מסתכלים, כלומר לא רוצים להסתכל, כל אחד תקוע בעניינים שלו, במסך שלו, מה אכפת להם,
    כל עוד הזוהמה לא נכנסת אליהם הביתה. הם עובדים נורא קשה בלהתעלם מההומלסים, מהזונות,
    מהנרקומנים שזרוקים בכל פינה, מהקבצנים בכל רמזור, מהפוסטרים הקרועים על הקירות,
    מהצבע שמתקלף מהבניינים, מהחלונות השבורים, מההזנחה, מהייאוש. הרי בשכונה המלוקקת
    שלהם זה אחרת, והם רק עוברים דרך כאן בדרך לעבודה וחזרה, והם לא באמת נמצאים פה אם
    יש חלון של מכונית שמפריד בינם לבין הסירחון והעולב, ואם הרדיו באוטו מספיק חזק אז
    הם לא צריכים להקשיב לצרחות, לצעקות, למוזיקה שהגיעה מהצד השני של העולם ובוקעת מחלונות
    של דירות מתפרקות.


    פעם עוד חשבתי שיש סיכוי לשינוי, שאם יקום הבנאדם הנכון ויעשה משהו דרסטי, אז לא
    תהיה להם ברירה והם ישימו לב, יפתחו את העיניים, אפילו אם זה מתוך רחמים, יראו מה
    הולך פה, איך אנשים חיים פה, אם אפשר לקרוא לזה חיים, מה המחיר שאנחנו משלמים כל
    יום בגלל הקיום העלוב הזה.


    יום אחד התעצבנתי נורא, ממש עלה לי הסעיף, ועברתי בין המכוניות וצעקתי עליהם שיסתכלו
    עליי, שירימו את הראש ויסתכלו לי בעיניים, שאני בנאדם, לא איזו דמות מעורפלת, שיש
    לי שם, שלכולנו פה יש שמות, שהחיים שלנו לא הפקר, שייקחו אחריות על מה שמסביבם, ובאתי
    להם ממש בפרצוף, ככה צרחתי להם לתוך החלון הסגור של האוטו "מה אנחנו, כלבים??", וראיתי
    את הפחד בעיניים שלהם, על זה שסוף סוף משהו חדר את החומות שלהם בלי הכנה מראש, על
    הסכנה שאולי קצת מהבחוץ יפלוש להם לתוך האוטו הנקי והנעים.


    כנראה שמישהו מהם אשכרה קלט אותי, והתקשר למשטרה, לא שזה עזר לו הרבה, כי אין פה
    ממש משטרה, אז לקח לשוטר המסכן כמעט שעה להגיע, וגם אז הוא לא ממש ידע מה לעשות.
    הוא בא אלי ושאל אם הכל בסדר, ואני באטרף שלי צעקתי עליו שהכל לא בסדר, שהעיר הזאת
    עייפה ודפוקה, ונמאס לי מהסחלה הזה, שהכל מטונף, הכל מלוכלך, שצריך לשטוף הכל. ואיך
    שאני גומר להגיד, פתאום היה ברק ורעם כאילו נפלה פצצה לידנו, והתחיל לרדת מבול שלא
    נגמר, ואני הסתכלתי למעלה ועצמתי עיניים ונתתי לגשם להרטיב אותי והתחלתי לצחוק.


    אחרי שלושה ימים של גשם נונסטופ והסתכלות באברבנאל חזרתי לאותו מקום. אנשים נסעו
    יותר לאט, וראיתי על הפנים של הנהגים שהם מסתכלים מסביב, מחפשים, נזהרים. שמתי לב
    שהאספלט של הכביש נקי, ואפשר לראות יותר טוב את הסימנים עליו. גם הבניינים המתפוררים
    נראו קצת פחות נורא בלי שכבת האבק הרגילה. אפילו העיר המכוערת הזאת נראית קצת יותר
    טוב אחרי הגשם.


