  story: "עלים יבשים הסתחררו ברוח המזרחית, רוקדים ריקוד של חמסין בין מכוניות מאובקות.\
    \ דררה גירשה יונה שהגיעה לשתות בשלולית קטנה של מי מזגן. היונה טפחה בכנפיה בזעם,\
    \ כשהדררה שתתה והרימה לעברה מקור מאיים. \nשלטי בחירות מנותקים וקרועים התנופפו\
    \ ברוח, מבטיחים הבטחות שווא. \nהאור מעוות, חולני, בקיץ שלא מסתיים גם בנובמבר.\
    \ זמן הדמדומים.\nהכל אבוד, לחשה בלי קול. הדמעות התייבשו מזמן. נותרו שקיות נפוחות\
    \ מתחת לעיניים ומחשבות על מדינה שפעם, מזמן, כל כך אהבה.\nשירד כבר גשם וישטוף הכל,\
    \ ביקשה בלי מילים. מטוסי קרב קרעו את השמים בשאון של טרום מלחמה. צל הסתיר את השמש.\
    \ כשהרימה עיניים לשמים ראתה ענני גשם מתקדרים מכיוון הים.\nאולי, בכל זאת? \nאומרים\
    \ שהתקווה מתה אחרונה.\n\n"
