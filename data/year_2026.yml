  story: 'השעה ארבע לפנות בוקר. עליה החלה להתנועע במיטה. זזות הידיים. לנגו החתול הזקן
    קלט מייד והחל לרוץ ריצות אמוק מצד לצד, תוך שהוא נוחת על עליה בצרחות - מעדן! מעדן
