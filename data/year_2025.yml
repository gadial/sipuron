    \ לא יצאו לי מהגרון ופתאום אני קלטתי שאני איתו שם לבד. הוא, אני, הספות הקורעות,\
    \ מאוור ובקבוק קולה ששכב לו שם לבד מי יודע כבר כמה זמן.\nהרגשתי כלואה, כלואה\
    \ בתוך ההבטחה והמחוייבת לעמוד במילה.\n\nהוא נעמד מולי מלא אכזבה אך לא הרפה.\
    \ מנסה לרכך את חוסר ההסכמה.\nהוא ביקש רק נשיקה בהתחלה ואני הסכמתי, אחרי כל מה\
    \ \"שהבטחתי\" הרגשתי מחוייבת לתת לו לפחות את זה. הנשיקה הפכה לנגיעה מתחת לחולצה.\
    \ הוא הושיב אותי על הספה ונעמד מולי. הוא הוריד את המכנסיים והוציא את הזין שלו\
    \ מהתחתונים. אני זוכרת שחשבתי שהזין שלו נראה כמו אגס וזה הצחיק אותי אז חייכתי.\
