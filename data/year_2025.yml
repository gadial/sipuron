    \ למפשעה שלו. \n\nהיה לי מגעיל ורציתי להפסיק, כל הזמן חשבתי לעצמי \"אני לא רוצה\
    \ להיות פה, אני רוצה שזה ייגמר\".\nהוא אמר לי \"יופי את רואה אנחנו כבר בחצי\
    \ הדרך, בואי נמשיך את תהני אני מבטיח לך\".\nכמו בובה קפואה הוא פיסל אותי על\
    \ המזרון שהיה על הרצפה, כולי חוששת וקפוצה, לא השאיר יותר מדי מקום למחשבה, הוריד\
    \ לי את התחתונים ודחף אליי את האגס שלו. \n\nהמשפט \"זה לא מה שרציתי, זה לא מה\
    \ שרציתי, זה לא מה שרציתי\" הדהד לי בתוך הראש בזמן שהתבוננתי במתרחש מלמעלה מתוך\
    \ ניתוק. הכאב המפלח החזיר אותי למציאות. שלוש חדירות היו מספיק בשביל להבין שזה\
    \ לא בשבילי. אני זוכרת את עצמי חושבת \"לא ככה תכננתי את הפעם הראשונה\" עצרתי\
    \ אותו בכוח ושכנעתי אותו בבכי שיפסיק. הוא אמר לי שאני צריכה לשלם את המחיר, ואם\
    \ אני לא נותנת לו לזיין אותי, לפחות אני צריכה למצוץ לו עד שיגמור. לא רציתי אבל\
    \ הרגשתי שזו הדרך הכי מהירה לצאת  משם ולסיים את חלום הבלהות הזה.\n\nאני יושבת\
