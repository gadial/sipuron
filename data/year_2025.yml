  story: "\"ההתחלה של הסוף קורעת לי את הבטן\".\nהמשפט הזה של רוני דלומי מעולם לא\
    \ היה כל כך מוחשי כמו ברגע הזה עכשיו.\n\nעברו כבר שנתיים מאז שאמא טסה לפורטוגל\
    \ ולא חזרה. בעל הבית ביקש שנפנה אותו. בית ילדותי. במושב שבו גדלתי. כל הזיכרונות.\
    \ כל החפצים שאמא שלי האגרנית אגרה במשך כל השנים. \n\nאבא אחותי ואני עומדים חסרי\
    \ אונים מול העבודה הרבה שמצפה לנו. אבא אומר שהוא לא מסוגל להתמודד עם זה. אחותי\
    \ אומרת שהיא עמוסה בעבודה ופשוט לא פנויה. יש רק שתי אופציות: האחת שאנחנו משלמים\
    \ לחברה חיצונית שתפנה את כל הבית. השנייה היא שאני לוקחת על עצמי את האחריות.\
    \ למיין, לארוז, למכור ולמסור את כל תכולת הבית. בחרתי באופציה השנייה. לא באמת\
    \ הייתה אופציה אחרת מבחינתי.\n\nאת מה שאני עושה בחודשיים האלה לא אשכח בחיים!\
    \ אני אשכרה מפנה את בית הוריי אחרי 23 שנים. אני ממיינת, מוסרת, שומרת, מוכרת,\
    \ וזורקת כל כך הרבה ג'אנק!\n\nאני מארגנת מכירת חצר גדולה בכל חודש יוני בימי\
    \ רביעי שישי ושבת שבה נמכור את כל הדברים השווים שיישארו אחרי שנחליט מה הולך\
    \ עם אבא לבית החדש ומה הולך לדירה שלי או לאחותי.\n\nאמא עשתה ואספה כל כך הרבה\
    \ דברים שזה מדהים, מכעיס ומעציב אותי בו זמנית. ההזנחה שבה גדלתי משתקפת בכל פינה\
    \ וזה כואב לי בנשמה. (לדעתי) זאת בדיוק הסיבה שלשאר המשפחה קשה להתמודד עם כל\
    \ הג'אנק הזה בפרט ועם המשימה הזאת בכלל.\n\n‏בעל הדירה הציע לאבא שלי הצעה להשאיר\
    \ את שני הדומים ופשוט להשאיר הכל. אבל יש פה ערימות של וזיכרונות וכסף (רק הדומים\
    \ עלו בערך 60 אלף שקל) שאני לא מוכנה לוותר עליהם. אני חייבת לעשות את זה בעצמי.\
    \ \n\nאני חווה כל כך הרבה רגשות מנוגדים. אהבה, כעס, היאחזות, השלמה, אכזבה, פרידה\
    \ והכרת תודה. את מה שאני עושה בחודשיים האלה אני לא אשכח בחיים. אני בזה לבד.\
    \ אבא ואחותי עובדים. אמא בפורטוגל לא מוכנה לחזור אפילו לחופשה לעזור במשימה ואני\
    \ פה בבית מטפלת בכל החפצים והזיכרונות של המשפחה. נושמת אבק ובדם יזע ודמעות אני\
    \ גורמת למעבר הזה לקרות.\n\nמצאתי לאבא דירה חדשה. כמו שאומרים הגיימרים אני עושה\
    \ \"קרי\" למשפחה. אני שמאובחנת בפוסט טראומה מורכבת. אני שנאנסתי לפני שנה וארבע\
    \ חודשים. אני העצמאית שבונה את העסק שלה, שעובדת על תערוכה ראשונה, שעושה קורס\
    \ בדו שיח ולומדת להפוך את הסיפור חיים שלי להרצאה.\n\nאני שמשתתפת ביוזמה \"אישה\
    \ יוצרת\" מעגל נשים ערביות ויהודית לקידום הדמוקרטיה והשלום. שגרה בשכונת מצוקה,\
    \ שלוקחת קורס ערבית, שמקבלת קצבת נכות, וסל שיקום, ייעוץ עסקי, שיקום תעסוקתי,\
    \ תמיכה וליווי. אני שדואגת לעצמה ומטפלת בעצמה. \n\nשמנהלת שני חשבונות אינסטגרם\
    \ ושני חשבונות פייסבוק וערוץ טלגרם ושתי קהילות. שכותבת שירים וחולמת להיות זמרת.\
    \ שבונה קמפיין גיוס המונים למימון המאבק משפטי מול מי שאנס אותי ותיעודו בסרט\
    \ תיעודו בסרט מהפכני.\n\nאני עושה כל כך הרבה דברים ועדיין בחרתי לפנות זמן ולטפל\
    \ בזבל המשפחתי. ליטרלי וסימבוליקלי. אני מביטה בתשומת לב בכל הפינות החשוכות ומביאה\
    \ לשם את האור שלי. מוציאה מהכוח אל הפועל. מוציאה לאור את האמת שלי כמו בחיים.\
    \ אני מסתכלת להזנחה הזאת בעיניים. אותה הזנחה שאפשרה להורים שלי לא לדעת שנאנסתי\
    \ שלוש פעמים עד גיל 30.\n\nאני מחבקת את הילדה הקטנה שמכינה לעצמה אוכל ועושה\
    \ לעצמה כביסה מכיתה  ד׳.\n\nאני מדפדפת בזיכרונות ומוצאת חמלה בתוכי לחוסר היכולת\
    \ שלהם להתמודד עם המצב. אני מוצאת בתוכי את הכוחות לצמוח. לעזור. לעשות מה שאני\
    \ יכולה. בשבילי ובשביל המשפחה שלי. \n\nבתוך כל זה אני תומכת בעצמי. אני משתמשת\
    \ בכלים שיש לי בשביל לעבד את כל מה שאני עוברת. בשביל לפרוק. בשביל לתת לעצמי\
    \ גב. את אני כותבת. כותבת ושרה את כל הכאבים והכעסים. הופכת את החרא של החיים\
    \ לזהב.\n\nכשהבית מתפרק\n\nכשהבית מתפרק\nוהמשפחה נשברת\nצאי החוצה שכבי על האדמה\
    \ \n\nכשהכל לא ידוע\nואת מרגישה אבודה \nצאי החוצה התנדנדי בנדנדה\n\nתזכרי שיש\
    \ מי שמחזיקה אותך \nתזכרי שפעם את למעלה ופעם למטה\nתזכרי שאת תמיד בתנועה\nהרוח\
    \ מלטפת גם כשאת שבורה\n\nכשהבית מתפרק\nוהמשפחה בטלטלה\nיש לך אותך חזקה\n\nומותר\
    \ גם לך להישבר\nלהתפרק\nלבכות על מה שמת\nושוב לקום\n\nאחרת\nקצת יותר בוגרת\n\
    קצת יותר גמישה \nקצת יותר רגישה\n\nוגם כשהיא אומרת לך\n\"נמאס שאת מתנהגת כמו\
    \ המלכה של המשפחה\"\nגם אז תזכירי לעצמך שאת לא מלכה\nאת פשוט אישה אמיצה ומסורה\n\
    שנותנת כל מה שהיא יכולה \nבשביל המשפחה.\n\n\nאני מנגבת את הדמעות וקמה מהדשא.\
    \ אני מתקשרת לכעוס על אמא. \n\nאני: \"את מבינה שאת אגרת ואגרת ואגרת ואני עכשיו\
    \ מתמודדת עם כל השיט שלך?! איך את לא באה?! למה את משאירה אותי להתמודד על הכל\
    \ לבד!\"\n\nאמא: \"פשושיקה שלי אני כל כך מעריכה את כל מה שאת עושה. אין לך מושג\
    \ כמה\".\n\nאני: \"אני לא צריכה הערכה אמא, אני צריכה עזרה, אני צריכה אותך\"\
    .\n\nאמא: \"אני פה איתך במרחק של שיחה. תתקשרי אליי ואני אהיה איתך מרחוק. אמיין\
    \ ואסדר ואעזור לך בכל החלטה. את לא לבד\".\n\nאני: \"טוב. בסדר. אני אוהבת אותך.\
    \ אבל תהיי זמינה אמא!\"\n\nאני חוזרת הביתה וממשיכה במיונים. אני מחליטה להתמקד\
    \ קודם כל בחדר שלי ובחפצים שלי. במה שיש לי הכי הרבה שליטה עליו והכי קל לי לקבל\
    \ בו החלטות כי הכל פה שלי ואני לא צריכה להתייעץ עם אף אחד.\n\nבין הספרים והמחברות\
    \ שלי אני מוצאת מחברת גדולה עם כריכה סגולה שכתוב עליה IQ בצבע צהוב עם שלוש שורות\
    \ צהובות. זכור לי שכתבתי שם קצת. אני מתמלאת סקרנות ופותחת לקרוא. זה מה שאני\
    \ קוראת:\n\nהתאריך 24/02/18 הכותרת: NINJA כותרת משנה: פרק 1\nבלה,בלה,בלה. זה\
    \ סתם קישקוש ועוד מילה.\nאיך מתחילים בכלל לתאר מסע.\nאיך מעבירים לדף את התחושה,\
    \ את השמחה, את הכעס, את הבלבול. את כל הבלאגן הזה שנקרא בן אדם.\nזה מתחיל בצעד,\
    \ צעד אחד קטן לעבר עצמך.\n\nמהלך 1 - חברה טובה.\nבין אם זה כלב או אדם, כל עוד\
    \ יש לו כוונה טובה הוא מחזיר לך אהבה, אם הסביבה מרגישה איתו בטוחה, הוא כנראה\
    \ חברה טובה.\nוכשיוצאים למסע תמיד כדאי שיהיו איתך חברים.\n\nחברים הם כאלה שיודעים\
    \ מי אתה באמת. כאלו שראו אותך בכל כך הרבה מצבים שהם יודעים מי אתה מתחת לכל השינויים.\
    \ מתחת לכל התחליפים וכל המסכות. כאלו שיודעים מה אתה יכול להיות, מה אתה רוצה\
    \ להיות, ומי אתה עכשיו.\n\nחברים יקרים שלי,\nאני כותבת לכם, אלו שתמיד בליבי,\
    \ יצאתי היום למסע וזה רישמי! תזכרו טוב טוב מה היה בהתחלה כי זה הוליד את הסיפור\
    \ הנפלא הזה ועוד רבים אחרים.\n\nעוד קשקושי ביצים, של חרוזים לא יוצלחים.\nמה\
    \ נסגר איתי? מנסה לחרטט אבל זה לא ממש הולך.\nכשאני דלוקה לשקר אין מקום. האמת\
    \ יוצאת לאור!\nזה גם ייתרון מאוד גדול כי זה מאפשר לי לראות את הפוטנציאל המדהים\
    \ שיש בי, אבל גם את כל השיט שלי שמעכב אותי ומפריע לי להיות עצמי.\n\nהזיוף מאוד\
    \ בולט לעין, כי בואו נודה בזה שיש לי שני מצופים במקום שדיים.\nמה לעזאזל חשבתי\
    \ לעצמי כשהכנסתי את החרא הזה לגוף שלי? ולמה לא עצרתם אותי?? טוב יכול להיות שניסיתם\
    \ לעצור אותי, אבל רוב הסיכויים שלא הקשבתי. מי כמוכם יודע שאני מורדת בדם. גם\
    \ בעצמי אני מורדת, ואז משלמת את המחיר ואוכלת המון חרא, חלק ממנו מתעכל לא רע,\
    \ תרגלים להכל בגדול. אבל חלק מהחרא הזה נהפך לצלקות מכוערות שפשוט מעידות על טעויות\
    \ מפגרות שעשיתי. כי כמוכם יודעים, לשים שני ראשי שום כתושים על הברך היה בהחלט\
    \ טעות מוגזמת מדי.\n\nאז למדתי שלפגוע בעצמך בכוונה זה דבילי ברמות.\nכמעט לא\
    \ משרת את המטרות וזה פאקינג כואב!\nמה שמדהים יותר זה שהכוויה הזאת שעשיתי לעצמי\
    \ בברך הצליחה להוציא את האבא האשכנזי שלי מהבית ואשכרה לחצות את הקווים הירוקים.\
    \ מה? פאק כן! הקווים הירוקים שלא נחצים מבחינה אידיאולוגית, הופ נחצו ואבא הגיע\
    \ לבקר אותי בבסיס.\n\n\nוואט דה פאק! מה קראתי עכשיו? כמה טוב שאני כותבת. אני\
    \ חושבת לעצמי. אין לזה תחליף זה פשוט פרייסלס שיש לי תיעוד שלי. טקסט שהוא צילום\
    \ מסך פנימי של התודעה שלי מלפני 5 שנים ועוד דלוקה על אסיד. בכלל ואו!\n\nלסיפור\
    \ הזה יש גם פרק שני - למסע הנינג'ה שלי. נגיע אליו בפרקים הבאים מבטיחה.\nנכון\
    \ לעכשיו אנחנו עומדים על 1238 מילים. למה אני סופרת מילים? כי הפרק הזה הוא הפרק\
    \ הראשון ברומן של חמישים אלף מילים שנכתב במסגרת אתגר בינלאומי שנקרא סיפורונובמבר\
    \ ובאנגלית National Novel Writing Month או בקיצור NaNoWriMo. באתגר הזה כותבים\
    \ רומן באורך של חמישים אלף מילים. כל יום יש נושא אחר. חילקתי 50 אלף ל-30 ימים\
    \ ויצא שכל פרק צריך להכיל 1667 מילים בדיוק כדי לעמוד באתגר. אז לשם אני מכוונת.\
    \ מה שאומר שאחרי הפסקה הקצרה הזאת יישארו לי בערך עוד 300 מילים שזה המון! אבל\
    \ אני זה גם חלק מהאתגר המבורך הזה שבחרתי לקחת בו חלק השנה ומי יודע אולי בסוף\
    \ יהיה לי אשכרה רומן לשחרר לעולם.\n\nאז נחזור להתחלה של הסוף שקורעת לי את הבטן.\n\
    פינוי בית הוריי היה ללא ספק אחד האתגרים הגדולים שאיתם התמודדתי לאורך החיים האלה.\
